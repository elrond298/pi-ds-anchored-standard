<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pedaling Pelican</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column;
         align-items: center; justify-content: center; background: #f4f7fb; }
  .cap { font-family: system-ui, sans-serif; color: #2f4858; letter-spacing: .1em; }
</style>
</head>
<body>
<svg viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Animated SVG of a pelican riding a bicycle">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3ff"/>
      <stop offset="1" stop-color="#eef7ff"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="800" height="500" fill="url(#sky)"/>

  <!-- sun with rotating rays -->
  <g>
    <g stroke="#ffd93d" stroke-width="6" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 90 80" to="360 90 80" dur="40s" repeatCount="indefinite"/>
      <line x1="90" y1="25" x2="90" y2="8"/>
      <line x1="90" y1="135" x2="90" y2="152"/>
      <line x1="25" y1="80" x2="8" y2="80"/>
      <line x1="155" y1="80" x2="172" y2="80"/>
      <line x1="44" y1="34" x2="33" y2="23"/>
      <line x1="136" y1="126" x2="147" y2="137"/>
      <line x1="136" y1="34" x2="147" y2="23"/>
      <line x1="44" y1="126" x2="33" y2="137"/>
    </g>
    <circle cx="90" cy="80" r="45" fill="#ffd93d"/>
  </g>

  <!-- drifting clouds -->
  <g fill="#ffffff" opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0 0;50 0;0 0" dur="16s" repeatCount="indefinite"/>
    <ellipse cx="140" cy="100" rx="45" ry="18"/>
    <ellipse cx="175" cy="90" rx="30" ry="14"/>
    <ellipse cx="110" cy="92" rx="25" ry="12"/>
  </g>
  <g fill="#ffffff" opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0 0;-40 0;0 0" dur="22s" repeatCount="indefinite"/>
    <ellipse cx="610" cy="70" rx="38" ry="15"/>
    <ellipse cx="642" cy="62" rx="25" ry="11"/>
  </g>

  <!-- ground & scrolling road -->
  <rect x="0" y="440" width="800" height="60" fill="#7ec850"/>
  <rect x="0" y="440" width="800" height="12" fill="#6f6f6f"/>
  <line x1="0" y1="447" x2="800" y2="447" stroke="#ffffff" stroke-width="4"
        stroke-dasharray="22 22">
    <animate attributeName="stroke-dashoffset" from="0" to="-44" dur="0.1s" repeatCount="indefinite"/>
  </line>

  <!-- bicycle frame -->
  <g stroke="#2f4858" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M210,370 L310,380 M210,370 L278,215 M278,215 L505,242
             M505,242 L310,380 M502,228 L514,258 M530,370 L506,250
             M508,250 L522,216 M522,216 Q546,204 550,226 M550,226 L556,238"/>
  </g>

  <!-- rear wheel -->
  <g transform="translate(210,370)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1s" repeatCount="indefinite"/>
      <circle r="67" fill="none" stroke="#3a3a3a" stroke-width="8"/>
      <circle r="64" fill="none" stroke="#2f4858" stroke-width="5"/>
      <g stroke="#2f4858" stroke-width="3">
        <line x1="0" y1="-62" x2="0" y2="62"/>
        <line x1="-62" y1="0" x2="62" y2="0"/>
        <line x1="-44" y1="-44" x2="44" y2="44"/>
        <line x1="44" y1="-44" x2="-44" y2="44"/>
      </g>
      <circle r="7" fill="#2f4858"/>
    </g>
  </g>

  <!-- front wheel -->
  <g transform="translate(530,370)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1s" repeatCount="indefinite"/>
      <circle r="67" fill="none" stroke="#3a3a3a" stroke-width="8"/>
      <circle r="64" fill="none" stroke="#2f4858" stroke-width="5"/>
      <g stroke="#2f4858" stroke-width="3">
        <line x1="0" y1="-62" x2="0" y2="62"/>
        <line x1="-62" y1="0" x2="62" y2="0"/>
        <line x1="-44" y1="-44" x2="44" y2="44"/>
        <line x1="44" y1="-44" x2="-44" y2="44"/>
      </g>
      <circle r="7" fill="#2f4858"/>
    </g>
  </g>

  <!-- crank, legs and pedals -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 310 380" to="360 310 380" dur="1s" repeatCount="indefinite"/>
    <circle cx="310" cy="380" r="16" fill="none" stroke="#2f4858" stroke-width="4"/>
    <line x1="310" y1="380" x2="310" y2="346" stroke="#f4a261" stroke-width="7" stroke-linecap="round"/>
    <line x1="310" y1="380" x2="310" y2="414" stroke="#f4a261" stroke-width="7" stroke-linecap="round"/>
    <g transform="translate(310,346)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1s" repeatCount="indefinite"/>
      <rect x="-9" y="-4" width="18" height="8" rx="3" fill="#333333"/>
    </g>
    <g transform="translate(310,414)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1s" repeatCount="indefinite"/>
      <rect x="-9" y="-4" width="18" height="8" rx="3" fill="#333333"/>
    </g>
  </g>

  <!-- tail and neck (behind body) -->
  <path d="M248,272 C215,258 198,248 188,238 C205,252 218,266 232,288 C240,298 250,302 260,302 Z"
        fill="#ffffff" stroke="#d9d9d9" stroke-width="2"/>
  <path d="M405,255 Q432,210 414,180" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>

  <!-- pelican body -->
  <ellipse cx="330" cy="285" rx="92" ry="96" fill="#fdfdf5" stroke="#d9d9d9" stroke-width="2"/>

  <!-- head, eye, beak -->
  <circle cx="415" cy="168" r="25" fill="#fdfdf5" stroke="#d9d9d9" stroke-width="2"/>
  <circle cx="424" cy="158" r="4.5" fill="#2f2f2f"/>
  <circle cx="425.5" cy="156.5" r="1.5" fill="#ffffff"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 435 166;2.5 435 166;0 435 166" dur="1.4s" repeatCount="indefinite"/>
    <path d="M433,160 C488,136 548,142 578,152 C540,155 492,160 437,174 Z"
          fill="#ffb84d" stroke="#e0902f" stroke-width="2"/>
    <path d="M437,174 C480,170 520,174 556,181 C505,198 470,203 440,181 Z"
          fill="#ffb84d" stroke="#e0902f" stroke-width="2"/>
    <path d="M442,179 C470,216 512,222 550,198 C520,192 486,186 442,179 Z"
          fill="#ffcf6b" stroke="#e0902f" stroke-width="2"/>
  </g>

  <!-- flapping wing -->
  <g transform="translate(340,278)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-10;-38;-10" keyTimes="0;0.5;1" dur="0.8s" repeatCount="indefinite"/>
      <ellipse cx="-20" cy="0" rx="55" ry="26" transform="rotate(-12)" fill="#f2f2f2" stroke="#cccccc" stroke-width="2"/>
    </g>
  </g>
</svg>
<p class="cap">PEDALING PELICAN</p>
</body>
</html>
