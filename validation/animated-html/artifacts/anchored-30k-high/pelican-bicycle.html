<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pelican Pedaling</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: linear-gradient(160deg, #0f2027, #203a43, #2c5364);
    font-family: system-ui, -apple-system, sans-serif;
  }
  svg { width: min(92vw, 820px); height: auto; display: block; }
</style>
</head>
<body>
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated pelican riding a bicycle">
  <title>Animated pelican riding a bicycle</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aedcf2"/>
      <stop offset="0.6" stop-color="#dceffb"/>
      <stop offset="1" stop-color="#f4fbfd"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fca6a"/>
      <stop offset="1" stop-color="#6aa84f"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d8790"/>
      <stop offset="1" stop-color="#5d666f"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="800" height="500" fill="url(#sky)"/>

  <!-- Sun -->
  <g transform="translate(690,92)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/>
      <g stroke="#ffd166" stroke-width="5" stroke-linecap="round">
        <line x1="0" y1="-58" x2="0" y2="-42"/>
        <line x1="0" y1="42" x2="0" y2="58"/>
        <line x1="-58" y1="0" x2="-42" y2="0"/>
        <line x1="42" y1="0" x2="58" y2="0"/>
        <line x1="-41" y1="-41" x2="-30" y2="-30"/>
        <line x1="30" y1="30" x2="41" y2="41"/>
        <line x1="41" y1="-41" x2="30" y2="-30"/>
        <line x1="-30" y1="30" x2="-41" y2="41"/>
      </g>
    </g>
    <circle r="34" fill="#ffd166"/>
    <circle r="34" fill="none" stroke="#f4b942" stroke-width="3"/>
  </g>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.92">
    <g>
      <animateTransform attributeName="transform" type="translate" values="-160 0; 900 0" dur="55s" repeatCount="indefinite"/>
      <ellipse cx="140" cy="120" rx="42" ry="18"/>
      <ellipse cx="175" cy="108" rx="32" ry="16"/>
      <ellipse cx="108" cy="110" rx="26" ry="13"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="-220 0; 900 0" dur="80s" begin="-30s" repeatCount="indefinite"/>
      <ellipse cx="480" cy="170" rx="50" ry="19"/>
      <ellipse cx="520" cy="156" rx="36" ry="17"/>
      <ellipse cx="446" cy="158" rx="28" ry="14"/>
    </g>
  </g>

  <!-- Distant hills -->
  <ellipse cx="180" cy="452" rx="260" ry="70" fill="#b7dd8d"/>
  <ellipse cx="640" cy="456" rx="320" ry="78" fill="#a8d47e"/>

  <!-- Ground -->
  <rect x="0" y="448" width="800" height="52" fill="url(#grass)"/>
  <rect x="0" y="452" width="800" height="48" fill="url(#road)"/>
  <!-- Moving road dashes -->
  <line x1="-100" y1="475" x2="900" y2="475" stroke="#f3f4f6" stroke-width="7" stroke-dasharray="32 28">
    <animateTransform attributeName="transform" type="translate" values="0 0; -60 0" dur="0.8s" repeatCount="indefinite"/>
  </line>

  <!-- Shadow -->
  <ellipse cx="400" cy="454" rx="135" ry="13" fill="#2b2b2b" opacity="0.16"/>

  <!-- ===== FAR LEG (behind bike) ===== -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path fill="none" stroke="#d98a2e" stroke-width="9">
      <animate attributeName="d" dur="2.4s" repeatCount="indefinite"
        keyTimes="0; 0.0833; 0.1667; 0.25; 0.3333; 0.4167; 0.5; 0.5833; 0.6667; 0.75; 0.8333; 0.9167"
        values="M 345 255 L 384.4 318.8 L 400.0 385.0; M 345 255 L 391.6 313.8 L 387.5 381.7; M 345 255 L 398.5 307.6 L 378.3 372.5; M 345 255 L 405.6 299.3 L 375.0 360.0; M 345 255 L 412.1 288.5 L 378.3 347.5; M 345 255 L 416.7 276.9 L 387.5 338.3; M 345 255 L 418.6 269.6 L 400.0 335.0; M 345 255 L 418.4 270.6 L 412.5 338.3; M 345 255 L 415.8 279.8 L 421.7 347.5; M 345 255 L 409.1 293.9 L 425.0 360.0; M 345 255 L 396.9 309.2 L 421.7 372.5; M 345 255 L 380.3 321.2 L 412.5 381.7"/>
    </path>
    <circle r="8.5" fill="#d98a2e" stroke="#b96f1e" stroke-width="2">
      <animate attributeName="cx" dur="2.4s" repeatCount="indefinite"
        keyTimes="0; 0.0833; 0.1667; 0.25; 0.3333; 0.4167; 0.5; 0.5833; 0.6667; 0.75; 0.8333; 0.9167"
        values="400.0; 387.5; 378.3; 375.0; 378.3; 387.5; 400.0; 412.5; 421.7; 425.0; 421.7; 412.5"/>
      <animate attributeName="cy" dur="2.4s" repeatCount="indefinite"
        keyTimes="0; 0.0833; 0.1667; 0.25; 0.3333; 0.4167; 0.5; 0.5833; 0.6667; 0.75; 0.8333; 0.9167"
        values="385.0; 381.7; 372.5; 360.0; 347.5; 338.3; 335.0; 338.3; 347.5; 360.0; 372.5; 381.7"/>
    </circle>
  </g>

  <!-- ===== BICYCLE ===== -->
  <g>
    <!-- Rear wheel -->
    <g transform="translate(250,380)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
        <circle r="70" fill="none" stroke="#3a3a3a" stroke-width="12"/>
        <circle r="63" fill="none" stroke="#c9c9c9" stroke-width="3"/>
        <line x1="-63" y1="0" x2="63" y2="0" stroke="#b5b5b5" stroke-width="2"/>
        <line x1="0" y1="-63" x2="0" y2="63" stroke="#b5b5b5" stroke-width="2"/>
        <line x1="-44.5" y1="-44.5" x2="44.5" y2="44.5" stroke="#b5b5b5" stroke-width="2"/>
        <line x1="44.5" y1="-44.5" x2="-44.5" y2="44.5" stroke="#b5b5b5" stroke-width="2"/>
        <circle r="6" fill="#555"/>
      </g>
    </g>

    <!-- Front wheel -->
    <g transform="translate(550,380)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
        <circle r="70" fill="none" stroke="#3a3a3a" stroke-width="12"/>
        <circle r="63" fill="none" stroke="#c9c9c9" stroke-width="3"/>
        <line x1="-63" y1="0" x2="63" y2="0" stroke="#b5b5b5" stroke-width="2"/>
        <line x1="0" y1="-63" x2="0" y2="63" stroke="#b5b5b5" stroke-width="2"/>
        <line x1="-44.5" y1="-44.5" x2="44.5" y2="44.5" stroke="#b5b5b5" stroke-width="2"/>
        <line x1="44.5" y1="-44.5" x2="-44.5" y2="44.5" stroke="#b5b5b5" stroke-width="2"/>
        <circle r="6" fill="#555"/>
      </g>
    </g>

    <!-- Chain + rear cog -->
    <circle cx="250" cy="380" r="8" fill="none" stroke="#444" stroke-width="5"/>
    <line x1="250" y1="372" x2="400" y2="352" stroke="#666" stroke-width="4"/>
    <line x1="250" y1="388" x2="400" y2="368" stroke="#666" stroke-width="4"/>

    <!-- Frame (outline + fill) -->
    <path d="M 250 380 L 350 250 M 400 360 L 250 380 M 400 360 L 350 250 M 400 360 L 540 260 M 350 250 L 540 250 M 540 250 L 550 380 M 350 250 L 342 240 M 540 250 L 555 232"
          fill="none" stroke="#b03a3a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 250 380 L 350 250 M 400 360 L 250 380 M 400 360 L 350 250 M 400 360 L 540 260 M 350 250 L 540 250 M 540 250 L 550 380 M 350 250 L 342 240 M 540 250 L 555 232"
          fill="none" stroke="#e05b5b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Seat -->
    <path d="M 316 240 C 316 231 360 229 366 240 C 360 247 320 247 316 240 Z" fill="#5a4a3a" stroke="#3f352b" stroke-width="2"/>

    <!-- Handlebar -->
    <path d="M 555 232 C 570 223 586 226 592 240" fill="none" stroke="#3a3a3a" stroke-width="6" stroke-linecap="round"/>
    <circle cx="592" cy="240" r="5" fill="#2c2c2c"/>

    <!-- Crank + pedals -->
    <g transform="translate(400,360)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.4s" repeatCount="indefinite"/>
        <circle r="16" fill="none" stroke="#444" stroke-width="6"/>
        <line x1="0" y1="0" x2="0" y2="-25" stroke="#444" stroke-width="6"/>
        <line x1="0" y1="0" x2="0" y2="25" stroke="#333" stroke-width="6"/>
        <rect x="-8" y="-29" width="16" height="8" rx="3" fill="#3a3a3a"/>
        <rect x="-8" y="21" width="16" height="8" rx="3" fill="#2c2c2c"/>
      </g>
    </g>
  </g>

  <!-- ===== PELICAN UPPER BODY (leans with pedaling) ===== -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="-3 345 255; 3 345 255; -3 345 255" keyTimes="0; 0.5; 1" dur="2.4s" repeatCount="indefinite"/>

    <!-- Tail feathers -->
    <g fill="#e6dfcc" stroke="#cfc7ae" stroke-width="2" stroke-linejoin="round">
      <path d="M 216 205 L 150 196 C 140 194 137 201 147 204 Z"/>
      <path d="M 213 216 L 148 210 C 138 208 136 216 146 219 Z"/>
      <path d="M 212 228 L 152 225 C 142 224 142 232 152 233 Z"/>
    </g>

    <!-- Body -->
    <ellipse cx="300" cy="205" rx="92" ry="58" fill="#f6f1e2" stroke="#d8d0bb" stroke-width="2.5"/>

    <!-- Neck -->
    <path d="M 356 178 C 372 152 378 128 396 116" fill="none" stroke="#f6f1e2" stroke-width="34" stroke-linecap="round"/>

    <!-- Head -->
    <ellipse cx="402" cy="116" rx="30" ry="26" fill="#f6f1e2" stroke="#d8d0bb" stroke-width="2.5"/>

    <!-- Crest -->
    <path d="M 388 93 C 390 83 400 81 407 87 C 399 85 393 87 391 93 Z" fill="#f6f1e2" stroke="#d8d0bb" stroke-width="2"/>

    <!-- Mouth interior (revealed when beak opens) -->
    <ellipse cx="432" cy="120" rx="10" ry="8" fill="#8a3434"/>

    <!-- Upper beak -->
    <path d="M 426 100 L 500 104 C 512 106 518 114 514 122 C 496 116 462 112 426 114 Z"
          fill="#f2a11f" stroke="#c97f10" stroke-width="2" stroke-linejoin="round"/>

    <!-- Lower beak + pouch (opens) -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 424 118; 16 424 118; 0 424 118" keyTimes="0; 0.5; 1" dur="2.6s" repeatCount="indefinite"/>
      <path d="M 424 118 L 496 120 C 508 122 512 128 510 134 L 424 132 Z"
            fill="#f7b733" stroke="#e09f2a" stroke-width="2" stroke-linejoin="round"/>
      <path d="M 424 132 C 440 150 470 156 500 148 C 508 144 512 138 510 134 C 490 138 460 140 424 132 Z"
            fill="#f9c74f" stroke="#e09f2a" stroke-width="1.5"/>
    </g>

    <!-- Eye -->
    <circle cx="410" cy="102" r="5.5" fill="#222222"/>
    <circle cx="412" cy="100" r="1.8" fill="#ffffff"/>

    <!-- Wing (flaps) -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-14 300 190; 12 300 190; -14 300 190" keyTimes="0; 0.5; 1" dur="1.1s" repeatCount="indefinite"/>
      <path d="M 278 185 C 312 172 348 178 356 198 C 344 216 306 220 282 208 Z"
            fill="#ece4d0" stroke="#d2c9b0" stroke-width="2" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- ===== NEAR LEG (in front of bike) ===== -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path fill="none" stroke="#f0a34a" stroke-width="9">
      <animate attributeName="d" dur="2.4s" repeatCount="indefinite"
        keyTimes="0; 0.0833; 0.1667; 0.25; 0.3333; 0.4167; 0.5; 0.5833; 0.6667; 0.75; 0.8333; 0.9167"
        values="M 345 255 L 418.6 269.6 L 400.0 335.0; M 345 255 L 418.4 270.6 L 412.5 338.3; M 345 255 L 415.8 279.8 L 421.7 347.5; M 345 255 L 409.1 293.9 L 425.0 360.0; M 345 255 L 396.9 309.2 L 421.7 372.5; M 345 255 L 380.3 321.2 L 412.5 381.7; M 345 255 L 384.4 318.8 L 400.0 385.0; M 345 255 L 391.6 313.8 L 387.5 381.7; M 345 255 L 398.5 307.6 L 378.3 372.5; M 345 255 L 405.6 299.3 L 375.0 360.0; M 345 255 L 412.1 288.5 L 378.3 347.5; M 345 255 L 416.7 276.9 L 387.5 338.3"/>
    </path>
    <circle r="8.5" fill="#f5b04a" stroke="#c97f1e" stroke-width="2">
      <animate attributeName="cx" dur="2.4s" repeatCount="indefinite"
        keyTimes="0; 0.0833; 0.1667; 0.25; 0.3333; 0.4167; 0.5; 0.5833; 0.6667; 0.75; 0.8333; 0.9167"
        values="400.0; 412.5; 421.7; 425.0; 421.7; 412.5; 400.0; 387.5; 378.3; 375.0; 378.3; 387.5"/>
      <animate attributeName="cy" dur="2.4s" repeatCount="indefinite"
        keyTimes="0; 0.0833; 0.1667; 0.25; 0.3333; 0.4167; 0.5; 0.5833; 0.6667; 0.75; 0.8333; 0.9167"
        values="335.0; 338.3; 347.5; 360.0; 372.5; 381.7; 385.0; 381.7; 372.5; 360.0; 347.5; 338.3"/>
    </circle>
  </g>
</svg>
</body>
</html>
