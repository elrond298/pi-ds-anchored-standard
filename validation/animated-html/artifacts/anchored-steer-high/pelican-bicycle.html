<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pelican on a Bicycle</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: linear-gradient(180deg, #7ec8f7 0%, #dff1fd 55%, #f7fafc 100%);
    display: grid;
    place-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  svg {
    width: min(94vw, 960px);
    height: auto;
    display: block;
  }
  .roadlines { animation: roadmove 0.55s linear infinite; }
  @keyframes roadmove {
    from { transform: translateX(0); }
    to   { transform: translateX(-80px); }
  }
  .clouds { animation: clouddrift 22s linear infinite; }
  @keyframes clouddrift {
    from { transform: translateX(0); }
    to   { transform: translateX(-360px); }
  }
  .sun { animation: sunpulse 3.5s ease-in-out infinite; }
  @keyframes sunpulse {
    0%, 100% { opacity: 0.95; }
    50%      { opacity: 0.65; }
  }
  .headnod { animation: nod 1.8s ease-in-out infinite; }
  @keyframes nod {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(4deg); }
  }
</style>
</head>
<body>
<svg viewBox="0 0 800 500" role="img" aria-label="Animated SVG of a pelican riding a bicycle">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6dbff0"/>
      <stop offset="1" stop-color="#eaf6fd"/>
    </linearGradient>
    <g id="wheel">
      <circle r="42" fill="none" stroke="#2b2b2b" stroke-width="8"/>
      <circle r="33" fill="none" stroke="#8a8a8a" stroke-width="2"/>
      <circle r="5" fill="#2b2b2b"/>
      <g stroke="#6f6f6f" stroke-width="2">
        <line x1="-33" y1="0" x2="33" y2="0"/>
        <line x1="0" y1="-33" x2="0" y2="33"/>
        <line x1="-23" y1="-23" x2="23" y2="23"/>
        <line x1="-23" y1="23" x2="23" y2="-23"/>
      </g>
    </g>
    <g id="cloudshape" fill="#ffffff" opacity="0.92">
      <ellipse cx="0" cy="0" rx="40" ry="18"/>
      <ellipse cx="-28" cy="6" rx="24" ry="12"/>
      <ellipse cx="30" cy="5" rx="26" ry="13"/>
    </g>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="800" height="500" fill="url(#sky)"/>

  <!-- Sun -->
  <g class="sun" transform="translate(700, 80)">
    <circle r="34" fill="#ffd43b"/>
    <g stroke="#ffd43b" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="-48" x2="0" y2="-60"/>
      <line x1="0" y1="48" x2="0" y2="60"/>
      <line x1="-48" y1="0" x2="-60" y2="0"/>
      <line x1="48" y1="0" x2="60" y2="0"/>
      <line x1="-34" y1="-34" x2="-42" y2="-42"/>
      <line x1="34" y1="-34" x2="42" y2="-42"/>
      <line x1="-34" y1="34" x2="-42" y2="42"/>
      <line x1="34" y1="34" x2="42" y2="42"/>
    </g>
  </g>

  <!-- Clouds -->
  <g class="clouds">
    <use href="#cloudshape" transform="translate(120, 90)"/>
    <use href="#cloudshape" transform="translate(480, 55) scale(0.85)"/>
    <use href="#cloudshape" transform="translate(840, 105) scale(1.1)"/>
  </g>

  <!-- Road -->
  <rect x="0" y="442" width="800" height="58" fill="#5a6670"/>
  <rect x="0" y="442" width="800" height="4" fill="#3f4a52"/>
  <g class="roadlines" fill="#eef2f4">
    <rect x="20" y="466" width="60" height="6" rx="3"/>
    <rect x="180" y="466" width="60" height="6" rx="3"/>
    <rect x="340" y="466" width="60" height="6" rx="3"/>
    <rect x="500" y="466" width="60" height="6" rx="3"/>
    <rect x="660" y="466" width="60" height="6" rx="3"/>
    <rect x="820" y="466" width="60" height="6" rx="3"/>
  </g>

  <!-- Shadow under bike -->
  <ellipse cx="375" cy="440" rx="200" ry="8" fill="#000" opacity="0.12"/>

  <!-- Rear wheel -->
  <g transform="translate(250, 395)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- Front wheel -->
  <g transform="translate(500, 395)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- Frame -->
  <g stroke="#d64545" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="360" y1="380" x2="330" y2="300"/>
    <line x1="360" y1="380" x2="490" y2="350"/>
    <line x1="330" y1="300" x2="480" y2="300"/>
    <line x1="490" y1="350" x2="480" y2="300"/>
    <line x1="250" y1="395" x2="330" y2="300"/>
    <line x1="250" y1="395" x2="360" y2="380"/>
    <line x1="490" y1="350" x2="500" y2="395"/>
  </g>

  <!-- Handlebars -->
  <g stroke="#2b2b2b" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M480 300 L488 300 Q 516 300 520 290"/>
    <line x1="480" y1="300" x2="492" y2="320"/>
  </g>

  <!-- Seat -->
  <g>
    <line x1="330" y1="300" x2="330" y2="286" stroke="#2b2b2b" stroke-width="6"/>
    <ellipse cx="330" cy="283" rx="16" ry="6" fill="#2b2b2b"/>
  </g>

  <!-- Crank + pedals + feet -->
  <g transform="translate(360, 380)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
      <circle r="7" fill="#2b2b2b"/>
      <line x1="0" y1="0" x2="21" y2="0" stroke="#2b2b2b" stroke-width="4"/>
      <line x1="0" y1="0" x2="-21" y2="0" stroke="#2b2b2b" stroke-width="4"/>
      <rect x="14" y="-3" width="15" height="6" rx="2" fill="#2b2b2b"/>
      <rect x="-29" y="-3" width="15" height="6" rx="2" fill="#2b2b2b"/>
      <ellipse cx="21" cy="5" rx="9" ry="5" fill="#f5a623"/>
      <ellipse cx="-21" cy="5" rx="9" ry="5" fill="#f5a623"/>
    </g>
  </g>

  <!-- Pelican -->
  <g>
    <!-- Tail -->
    <path d="M248 240 L198 238 L234 252 L194 256 L236 268 L248 270 Z" fill="#6b6b6b"/>

    <!-- Legs -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-16 318 262; 22 318 262; -16 318 262" dur="0.9s" repeatCount="indefinite"/>
      <path d="M318 262 Q 344 316 356 370" fill="none" stroke="#f5a623" stroke-width="7" stroke-linecap="round"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="22 318 262; -16 318 262; 22 318 262" dur="0.9s" repeatCount="indefinite"/>
      <path d="M312 262 Q 320 320 336 372" fill="none" stroke="#e08e1e" stroke-width="7" stroke-linecap="round"/>
    </g>

    <!-- Neck -->
    <path d="M335 222 Q 382 192 396 172" fill="none" stroke="#d9d9d9" stroke-width="28" stroke-linecap="round"/>
    <path d="M335 222 Q 382 192 396 172" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>

    <!-- Body -->
    <ellipse cx="300" cy="248" rx="62" ry="46" fill="#ffffff" stroke="#d9d9d9" stroke-width="2"/>

    <!-- Wing -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-5 340 248; 12 340 248; -5 340 248" dur="1.4s" repeatCount="indefinite"/>
      <path d="M336 240 Q 400 262 478 294 Q 405 304 322 278 Q 320 256 336 240 Z" fill="#eaeaea" stroke="#d0d0d0" stroke-width="2"/>
      <path d="M470 288 L 492 296 L 466 300 Z" fill="#6b6b6b"/>
    </g>

    <!-- Head + beak -->
    <g class="headnod">
      <circle cx="398" cy="158" r="22" fill="#ffffff" stroke="#d9d9d9" stroke-width="2"/>
      <circle cx="407" cy="150" r="3" fill="#1a1a1a"/>
      <path d="M410 150 Q 480 142 548 162 Q 480 156 410 166 Z" fill="#f78f1e"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 410 166; 10 410 166; 0 410 166" dur="2.4s" repeatCount="indefinite"/>
        <path d="M410 166 Q 470 200 545 164 L 548 162 Q 480 172 410 176 Z" fill="#f7b733"/>
      </g>
    </g>
  </g>
</svg>
</body>
</html>
